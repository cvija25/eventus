name: Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore Services/Services.sln

      - name: Build
        run: dotnet build Services/Services.sln --no-restore --configuration Release

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore Services/Services.sln

      # The integration and end-to-end tests start Postgres, RabbitMQ and MongoDB through
      # Testcontainers, using the Docker socket the runner already provides.
      - name: Test
        run: dotnet test Services/Services.sln --no-restore --configuration Release
