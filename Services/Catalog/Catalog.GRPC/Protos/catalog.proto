syntax = "proto3";

option csharp_namespace = "Catalog.GRPC";

package catalog;

service Catalog {
  rpc GetEventPrice (GetEventPriceRequest) returns (GetEventPriceResponse);
}

message GetEventPriceRequest {
  string event_id = 1;
}
message GetEventPriceResponse {
  int64 price_yes = 1;
  int64 price_no = 2;
  int64 pot_size = 3;
}
