services:
  account:
    image: account
    build:
      context: .
      dockerfile: Account/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  catalog.api:
    image: catalog.api
    build:
      context: .
      dockerfile: Catalog/Catalog.API/Dockerfile
    ports:
      - "8081:8080"

  game:
    image: game
    build:
      context: .
      dockerfile: Game/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
#        
#  gameDB:
#  accountDB:
#  accountGameMQ:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  rabbitmq_data: