services:
  account:
    image: account
    build:
      context: .
      dockerfile: Account/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      game:
        condition: service_started
      account-db:
        condition: service_healthy

  catalog.api:
    image: catalog.api
    build:
      context: .
      dockerfile: Catalog/Catalog.API/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  catalog.grpc:
    image: catalog.grpc
    build:
      context: .
      dockerfile: Catalog/Catalog.GRPC/Dockerfile
    ports:
      - "8083:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
          

  account-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventus_account
    ports:
      - "5433:5432"
    volumes:
      - account-db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventus_catalog
    ports:
      - "5432:5432"
    volumes:
      - catalog-db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - catalog-db

  game:
    image: game
    build:
      context: .
      dockerfile: Game/Dockerfile
    ports:
      - "8082:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      catalog.grpc:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  api.gateway:
    image: api.gateway
    build:
      context: .
      dockerfile: API.Gateway/Dockerfile
    ports:
      - "1234:8080"
    depends_on:
      account:
        condition: service_started
      game:
        condition: service_started
      catalog.api:
        condition: service_started
      identity.api:
        condition: service_started

  identity.api:
    image: identity.api
    build:
      context: .
      dockerfile: Identity/Identity.API/Dockerfile
    ports:
      - "8084:8080"
    depends_on:
      - identity-db
      - account

  identity-db:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - identity-db_data:/data/db

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  catalog-db_data:
  account-db_data:
  rabbitmq_data:
  identity-db_data:
  kafka-data:
